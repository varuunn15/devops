apiVersion: skaffold/v4beta13
kind: Config

build:
  # EKS nodes pull images from ECR, so Skaffold must push each built image.
  local:
    push: true
  tagPolicy:
    sha256: {}
    
  artifacts:
  - image: frontend
    context: frontend
    docker:
      dockerfile: Dockerfile
    sync:
      infer:
        - "src/**"
  
  - image: 688928000248.dkr.ecr.ap-southeast-1.amazonaws.com/ai-orchestration
    context: ai-orchestration
    docker:
      dockerfile: dockerfile
    sync:
      infer:
        - "src/**"

  - image: 688928000248.dkr.ecr.ap-southeast-1.amazonaws.com/auth
    context: auth
    docker:
      dockerfile: dockerfile
    sync:
      infer:
        - "src/**"
        
  - image: 688928000248.dkr.ecr.ap-southeast-1.amazonaws.com/notification
    context: notification
    docker:
      dockerfile: dockerfile
    sync:
      infer:
        - "src/**"      

  - image: 688928000248.dkr.ecr.ap-southeast-1.amazonaws.com/agent
    context: sandbox/agent
    docker:
      dockerfile: dockerfile

  - image: 688928000248.dkr.ecr.ap-southeast-1.amazonaws.com/sync-agent
    context: sandbox/sync-agent
    docker:
      dockerfile: dockerfile

  - image: 688928000248.dkr.ecr.ap-southeast-1.amazonaws.com/router
    context: sandbox/router
    docker:
      dockerfile: dockerfile

  - image: 688928000248.dkr.ecr.ap-southeast-1.amazonaws.com/sandbox
    context: sandbox/server
    docker:
      dockerfile: dockerfile

  - image: 688928000248.dkr.ecr.ap-southeast-1.amazonaws.com/template
    context: sandbox/template
    docker:
      dockerfile: dockerfile

manifests:
  rawYaml:
    - k8s/ai-deployment.yml
    - k8s/ai-service.yml
    - k8s/auth-deployment.yml
    - k8s/auth-service.yml
    - k8s/sandbox-deployment.yml
    - k8s/sandbox-service.yml
    - k8s/ingress.yml
    - k8s/router-deployment.yml
    - k8s/router-service.yml
    - k8s/rbac.yml
    - k8s/notification-deployment.yml
    - k8s/notification-service.yml
    - k8s/frontend-deployment.yml
    - k8s/frontend-service.yml

portForward:
  - resourceType: deployment
    resourceName: frontend-deployment
    port: 5173
    localPort: 5173
  - resourceType: deployment
    resourceName: sandbox-deployment
    port: 3000
    localPort: 3000
  - resourceType: deployment
    resourceName: auth-deployment
    port: 3000
    localPort: 3001
  - resourceType: deployment
    resourceName: ai-deployment
    port: 3000
    localPort: 3002
  - resourceType: service
    resourceName: router-service
    port: 80
    localPort: 8080
