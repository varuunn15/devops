# Template for Kubernetes Secrets in AgentSpace
# Copy this file to k8s/secrets.yml and fill in your actual credentials.
# Apply to cluster with: kubectl apply -f k8s/secrets.yml

apiVersion: v1
kind: Secret
metadata:
  name: database
type: Opaque
stringData:
  AUTH: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/auth"
  SANDBOX: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/sandbox"
  AI: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/ai"
  REDIS_URL: "redis://default:<password>@<host>:<port>"
  RABBITMQ_URL: "amqps://<user>:<password>@<host>/<vhost>"

---

apiVersion: v1
kind: Secret
metadata:
  name: jwt
type: Opaque
stringData:
  JWT_SECRET: "your-super-secret-random-jwt-key-32-chars-minimum"

---

apiVersion: v1
kind: Secret
metadata:
  name: google
type: Opaque
stringData:
  GOOGLE_CLIENT_ID: "your-google-oauth-client-id.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "your-google-oauth-client-secret"
  GOOGLE_REFRESH_TOKEN: "your-google-oauth-refresh-token-for-email"
  EMAIL_USER: "your-notification-sender@gmail.com"

---

apiVersion: v1
kind: Secret
metadata:
  name: ai-secret
type: Opaque
stringData:
  MISTRAL_API_KEY: "your-mistral-ai-api-key"

---

apiVersion: v1
kind: Secret
metadata:
  name: aws
type: Opaque
stringData:
  AWS_REGION: "ap-southeast-1"
  AWS_ACCESS_KEY_ID: "your-aws-access-key-id"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret-access-key"
