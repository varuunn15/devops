apiVersion: apps/v1
kind: Deployment
metadata:
  name:  sandbox-deployment
  labels:
    name:  sandbox-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-api
  template:
    metadata:
      labels:
        app: sandbox-api
    spec:
      serviceAccountName: resource-manager
      containers:
      - image: sandbox
        imagePullPolicy: IfNotPresent
        name:  main-sandbox-container
        resources:
          limits:
            cpu: "500m"
            memory: "400Mi"
          requests:
            cpu: "250m"
            memory: "200Mi"
        livenessProbe:
          httpGet:
            path: /api/sandbox/health
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
          - name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: database
                key: REDIS_URL
                
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: jwt
                key: JWT_SECRET
                
          - name: MONGO_URI
            valueFrom:
              secretKeyRef:
                name: database
                key: SANDBOX
          - name: SANDBOX_DOMAIN
            value: localhost
          - name: PREVIEW_DOMAIN
            value: preview.localhost:8080
          - name: SANDBOX_PROTOCOL
            value: http
          - name: AWS_REGION
            valueFrom:
              secretKeyRef:
                name: aws
                key: AWS_REGION
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: aws
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: aws
                key: AWS_SECRET_ACCESS_KEY
          - name: BUCKET_NAME
            value: agentspace-688928000248-ap-south-1-an
        readinessProbe:
          httpGet:
            path: /api/sandbox/health
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10      
        ports:
        - containerPort:  3000
          name:  main-sandbox
      
